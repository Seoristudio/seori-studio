<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A July phone wallpaper from Seori Studio."
    >
    <link rel="canonical" href="https://seori.studio/wallpaper/july/">
    <meta property="og:url" content="https://seori.studio/wallpaper/july/">
    <meta property="og:title" content="July Wallpaper | Seori Studio">
    <meta
      property="og:description"
      content="Choose and download a July phone wallpaper from Seori Studio."
    >
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://seori.studio/assets/images/hero/sky-garden-stars.jpg">
    <title>July Wallpaper | Seori Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Hanken+Grotesk:wght@300..600&display=swap"
      rel="stylesheet"
    >
    <link rel="icon" href="../../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16x16.png">
    <link rel="preload" as="image" href="../../assets/images/hero/sky-garden-stars.jpg">
    <style>
      :root {
        --bg: #fffdf8;
        --ink: #1b1f24;
        --muted: rgba(27, 31, 36, 0.7);
        --paper: rgba(255, 253, 248, 0.78);
        --line: rgba(27, 31, 36, 0.14);
        --button: rgb(24, 113, 237);
        --button-text: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100%;
        margin: 0;
        color: var(--ink);
        font-family: "Hanken Grotesk", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.45;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      .wallpaper-page {
        position: relative;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        background: var(--bg);
        isolation: isolate;
      }

      .wallpaper-page::before,
      .wallpaper-page::after {
        position: fixed;
        inset: 0;
        z-index: -3;
        content: "";
        pointer-events: none;
      }

      .wallpaper-page::before {
        background-image: url("../../assets/images/hero/sky-garden-stars.jpg");
        background-position: 50% 42%;
        background-size: cover;
        transform: scale(1.04);
      }

      .wallpaper-page::after {
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(255, 253, 248, 0.34), rgba(255, 253, 248, 0.58) 72%, rgba(255, 253, 248, 0.68)),
          rgba(255, 253, 248, 0.2);
        backdrop-filter: blur(0.8px);
      }

      .flare-layer {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image:
          radial-gradient(circle at 16% 20%, rgba(255, 244, 196, 0.48), transparent 9%),
          radial-gradient(circle at 35% 38%, rgba(255, 220, 235, 0.32), transparent 8%),
          radial-gradient(circle at 60% 30%, rgba(255, 249, 212, 0.38), transparent 8%),
          radial-gradient(circle at 82% 18%, rgba(255, 232, 241, 0.34), transparent 7%),
          radial-gradient(circle at 72% 52%, rgba(255, 245, 196, 0.32), transparent 8%);
        filter: blur(12px);
        opacity: 0.82;
        pointer-events: none;
      }

      .wallpaper-shell {
        position: relative;
        display: grid;
        width: min(100%, 460px);
        min-height: 100svh;
        margin: 0 auto;
        padding: 14px 22px 14px;
      }

      .campaign-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 30px;
      }

      .brand-link {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-size: 18px;
        font-weight: 430;
        line-height: 1;
      }

      .campaign-tag {
        color: rgba(27, 31, 36, 0.72);
        font-size: 11px;
        font-weight: 520;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .campaign-content {
        display: grid;
        align-content: start;
        gap: 8px;
        padding: clamp(8px, 2svh, 16px) 0 0;
      }

      .campaign-copy {
        display: grid;
        gap: 8px;
        text-align: center;
      }

      .campaign-copy h1 {
        margin: 0;
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-size: clamp(31px, 9vw, 43px);
        font-weight: 360;
        line-height: 1;
        white-space: nowrap;
      }

      .campaign-copy p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.38;
      }

      .carousel-wrap {
        display: grid;
        gap: 12px;
        overflow: visible;
      }

      .phone-stage {
        position: relative;
        width: min(48vw, 190px, calc((100svh - 318px) * 0.4615));
        margin: 0 auto;
        overflow: visible;
      }

      .phone-frame {
        position: relative;
        padding: 5px;
        overflow: visible;
        border: 1px solid rgba(15, 18, 22, 0.92);
        border-radius: 30px;
        background: #343a40;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          0 14px 34px rgba(20, 28, 40, 0.24);
      }

      .phone-screen {
        position: relative;
        aspect-ratio: 9 / 19.5;
        height: auto;
        overflow: hidden;
        border-radius: 24px;
        background: #eff3f3;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
      }

      .phone-notch {
        position: absolute;
        top: 11px;
        left: 50%;
        z-index: 6;
        width: 50px;
        height: 15px;
        border-radius: 999px;
        background: rgba(12, 15, 20, 0.86);
        transform: translateX(-50%);
      }

      .phone-status,
      .lockscreen-copy {
        position: absolute;
        z-index: 5;
        color: rgba(255, 255, 255, 0.94);
        pointer-events: none;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.28);
      }

      .phone-status {
        top: 10px;
        right: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 8px;
        font-weight: 640;
        line-height: 1;
      }

      .phone-status {
        display: none;
      }

      .status-icons {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }

      .signal-icon {
        display: inline-flex;
        align-items: flex-end;
        gap: 1px;
        height: 7px;
      }

      .signal-icon span {
        display: block;
        width: 2px;
        border-radius: 999px;
        background: currentColor;
      }

      .signal-icon span:nth-child(1) {
        height: 3px;
      }

      .signal-icon span:nth-child(2) {
        height: 5px;
      }

      .signal-icon span:nth-child(3) {
        height: 7px;
      }

      .wifi-icon {
        position: relative;
        width: 9px;
        height: 7px;
      }

      .wifi-icon::before {
        position: absolute;
        inset: 0;
        border-top: 2px solid currentColor;
        border-radius: 999px 999px 0 0;
        content: "";
      }

      .wifi-icon::after {
        position: absolute;
        right: 3px;
        bottom: 0;
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      .battery-icon {
        position: relative;
        width: 13px;
        height: 7px;
        border: 1px solid currentColor;
        border-radius: 2px;
      }

      .battery-icon::before {
        position: absolute;
        top: 2px;
        right: -3px;
        width: 2px;
        height: 3px;
        border-radius: 0 2px 2px 0;
        background: currentColor;
        content: "";
      }

      .battery-icon::after {
        position: absolute;
        inset: 1px 3px 1px 1px;
        border-radius: 1px;
        background: currentColor;
        content: "";
      }

      .lockscreen-copy {
        top: 32px;
        right: 8px;
        left: 8px;
        display: grid;
        justify-items: center;
        gap: 3px;
        text-align: center;
      }

      .lockscreen-date {
        font-size: 12px;
        font-weight: 560;
        line-height: 1.05;
      }

      .lockscreen-time {
        font-size: 48px;
        font-weight: 520;
        line-height: 0.86;
        letter-spacing: 0;
      }

      .lockscreen-actions {
        position: absolute;
        right: 24px;
        bottom: 20px;
        left: 24px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        pointer-events: none;
      }

      .lockscreen-action {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: rgba(32, 32, 32, 0.5);
        color: rgba(255, 255, 255, 0.96);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          0 1px 4px rgba(0, 0, 0, 0.22);
      }

      .lockscreen-icon {
        display: block;
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .lockscreen-icon--flashlight {
        width: 14px;
        height: 14px;
        fill: currentColor;
        stroke: none;
      }

      .wallpaper-track {
        position: relative;
        display: block;
        height: 100%;
        background: #9ed7f2;
        backface-visibility: hidden;
        touch-action: pan-y;
        scrollbar-width: none;
      }

      .wallpaper-track::-webkit-scrollbar {
        display: none;
      }

      .wallpaper-slide {
        position: absolute;
        inset: 0;
        z-index: 0;
        height: 100%;
        margin: 0;
        background: #9ed7f2;
        backface-visibility: hidden;
        opacity: 0;
        transition: opacity 180ms ease;
        visibility: hidden;
      }

      .wallpaper-slide.is-active {
        z-index: 1;
        opacity: 1;
        visibility: visible;
      }

      .wallpaper-slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translateZ(0);
      }

      .carousel-button {
        position: absolute;
        top: 50%;
        z-index: 7;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.86);
        border-radius: 999px;
        background: rgb(255, 253, 248);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(20, 28, 40, 0.14);
        transform: translateY(-50%);
      }

      .carousel-button::before {
        width: 9px;
        height: 9px;
        border-top: 1.5px solid currentColor;
        border-left: 1.5px solid currentColor;
        content: "";
      }

      .carousel-button--prev {
        left: -50px;
      }

      .carousel-button--prev::before {
        transform: translateX(2px) rotate(-45deg);
      }

      .carousel-button--next {
        right: -50px;
      }

      .carousel-button--next::before {
        transform: translateX(-2px) rotate(135deg);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        overflow: hidden;
        border: 0;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .carousel-meta {
        display: grid;
        gap: 13px;
        justify-items: center;
      }

      .wallpaper-title {
        min-height: 18px;
        color: var(--ink);
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-size: 18px;
        font-weight: 430;
        line-height: 1.1;
      }

      .dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .dot {
        width: 7px;
        height: 7px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: rgba(27, 31, 36, 0.24);
        cursor: pointer;
      }

      .dot[aria-current="true"] {
        width: 22px;
        background: rgba(27, 31, 36, 0.74);
      }

      .action-panel {
        display: grid;
        gap: 16px;
        justify-items: center;
        padding: 8px 0 0;
      }

      .download-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: min(100%, 330px);
        min-height: 46px;
        padding: 13px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--button);
        color: var(--button-text);
        font-size: 14px;
        font-weight: 560;
        line-height: 1;
        box-shadow: 0 16px 34px rgba(24, 113, 237, 0.22);
      }

      .campaign-footer {
        display: grid;
        gap: 4px;
        justify-items: center;
        color: rgba(27, 31, 36, 0.78);
        font-size: 14px;
        line-height: 1.2;
        text-align: center;
      }

      .campaign-footer a {
        color: var(--ink);
        border-bottom: 1px solid var(--ink);
      }

      .campaign-footer strong {
        color: var(--ink);
        font-weight: 640;
      }

      @media (min-width: 680px) {
        .wallpaper-shell {
          min-height: 100vh;
          padding-block: 28px;
        }

        .phone-stage {
          width: 246px;
        }
      }

      @media (max-height: 760px) {
        .wallpaper-shell {
          padding-top: 14px;
          padding-bottom: 14px;
        }

        .campaign-content {
          gap: 8px;
          padding-top: 2px;
        }

        .campaign-copy h1 {
          font-size: clamp(28px, 8vw, 36px);
        }

        .phone-stage {
          width: min(46vw, 178px, calc((100svh - 312px) * 0.4615));
        }

        .campaign-footer {
          font-size: 13px;
        }
      }

      @media (max-height: 720px) {
        .wallpaper-shell {
          padding-top: 10px;
          padding-bottom: 10px;
        }

        .campaign-content {
          gap: 6px;
          padding-top: 0;
        }

        .campaign-copy h1 {
          font-size: clamp(27px, 7.6vw, 34px);
        }

        .phone-stage {
          width: min(43vw, 166px, calc((100svh - 306px) * 0.4615));
        }

        .download-button {
          min-height: 44px;
          padding-block: 12px;
        }
      }

      @media (min-width: 780px) {
        .wallpaper-shell {
          width: min(100%, 800px);
          padding: 18px 28px;
        }

        .campaign-content {
          grid-template-areas:
            "carousel copy"
            "carousel action";
          grid-template-columns: minmax(220px, 260px) minmax(280px, 340px);
          align-content: center;
          align-items: center;
          justify-content: center;
          column-gap: 42px;
          row-gap: 16px;
          padding-top: 0;
        }

        .campaign-copy {
          grid-area: copy;
          text-align: left;
        }

        .campaign-copy h1 {
          font-size: clamp(40px, 5vw, 58px);
          white-space: normal;
        }

        .carousel-wrap {
          grid-area: carousel;
        }

        .phone-stage {
          width: min(22vw, 210px);
        }

        .action-panel {
          grid-area: action;
          justify-items: start;
          padding-top: 0;
        }

        .download-button {
          width: 100%;
        }

        .campaign-footer {
          justify-items: start;
          text-align: left;
        }
      }
    </style>
  </head>
  <body class="wallpaper-page">
    <div class="flare-layer" aria-hidden="true"></div>
    <div class="wallpaper-shell">
      <header class="campaign-header" aria-label="Campaign header">
        <a class="brand-link" href="../../">seori.studio</a>
        <span class="campaign-tag">July wallpaper 2026</span>
      </header>

      <main class="campaign-content">
        <section class="campaign-copy" aria-labelledby="page-title">
          <h1 id="page-title">choose your July</h1>
          <p>Swipe, pick one, and save it to your phone.</p>
        </section>

        <section class="carousel-wrap" aria-label="Wallpaper choices">
          <div class="phone-stage">
            <div class="phone-frame" aria-live="polite">
              <div class="phone-notch" aria-hidden="true"></div>
              <div class="phone-screen">
                <div class="phone-status" aria-hidden="true">
                  <span>9:41</span>
                  <span class="status-icons">
                    <span class="signal-icon">
                      <span></span>
                      <span></span>
                      <span></span>
                    </span>
                    <span class="wifi-icon"></span>
                    <span class="battery-icon"></span>
                  </span>
                </div>
                <div class="lockscreen-copy" aria-hidden="true">
                  <span class="lockscreen-date">Tuesday, July 7</span>
                  <span class="lockscreen-time">10:00</span>
                </div>
                <div class="lockscreen-actions" aria-hidden="true">
                  <span class="lockscreen-action">
                    <svg class="lockscreen-icon lockscreen-icon--flashlight" viewBox="0 0 24 24" focusable="false">
                      <path d="M7.7 3.25c0-.7.56-1.25 1.25-1.25h6.1c.69 0 1.25.55 1.25 1.25v2.5c0 .69-.56 1.25-1.25 1.25h-6.1c-.69 0-1.25-.56-1.25-1.25v-2.5Z"></path>
                      <path d="M8.85 8.2h6.3l-1.05 3.15a3.6 3.6 0 0 0-.18 1.13v6.55A2.03 2.03 0 0 1 11.9 21h.2a2.03 2.03 0 0 1-2.02-1.97v-6.55c0-.38-.06-.76-.18-1.13L8.85 8.2Z"></path>
                    </svg>
                  </span>
                  <span class="lockscreen-action">
                    <svg class="lockscreen-icon" viewBox="0 0 24 24" focusable="false">
                      <path d="M6.6 7.4h2.3l1.2-2h3.8l1.2 2h2.3a2.6 2.6 0 0 1 2.6 2.6v6.4a2.6 2.6 0 0 1-2.6 2.6H6.6A2.6 2.6 0 0 1 4 16.4V10a2.6 2.6 0 0 1 2.6-2.6Z"></path>
                      <circle cx="12" cy="13.2" r="3.2"></circle>
                    </svg>
                  </span>
                </div>
                <div class="wallpaper-track" data-wallpaper-track>
                  <figure class="wallpaper-slide" style="--wallpaper: url('../../assets/wallpapers/2026-07-wallpaper-01.png?v=20260705-final');">
                    <img
                      src="../../assets/wallpapers/2026-07-wallpaper-01.png?v=20260705-final"
                      alt="Wallpaper option 1 preview."
                      width="1440"
                      height="3120"
                    >
                  </figure>
                  <figure class="wallpaper-slide" style="--wallpaper: url('../../assets/wallpapers/2026-07-wallpaper-02.png?v=20260705-final');">
                    <img
                      src="../../assets/wallpapers/2026-07-wallpaper-02.png?v=20260705-final"
                      alt="Wallpaper option 2 preview."
                      width="1440"
                      height="3120"
                    >
                  </figure>
                  <figure class="wallpaper-slide" style="--wallpaper: url('../../assets/wallpapers/2026-07-wallpaper-03.png?v=20260705-final');">
                    <img
                      src="../../assets/wallpapers/2026-07-wallpaper-03.png?v=20260705-final"
                      alt="Wallpaper option 3 preview."
                      width="1440"
                      height="3120"
                    >
                  </figure>
                </div>
              </div>
            </div>

            <button class="carousel-button carousel-button--prev" type="button" data-carousel-prev>
              <span class="sr-only">Previous wallpaper</span>
            </button>
            <button class="carousel-button carousel-button--next" type="button" data-carousel-next>
              <span class="sr-only">Next wallpaper</span>
            </button>
          </div>

          <div class="carousel-meta">
            <div class="wallpaper-title" data-wallpaper-title>wallpaper 01</div>
            <div class="dots" aria-label="Select wallpaper">
              <button class="dot" type="button" aria-label="Wallpaper 01" aria-current="true" data-dot="0"></button>
              <button class="dot" type="button" aria-label="Wallpaper 02" aria-current="false" data-dot="1"></button>
              <button class="dot" type="button" aria-label="Wallpaper 03" aria-current="false" data-dot="2"></button>
            </div>
          </div>
        </section>

        <section class="action-panel" aria-label="Download">
          <a
            class="download-button"
            href="../../assets/wallpapers/2026-07-wallpaper-01.png?v=20260705-final"
            download="seori-studio-july-wallpaper-01.png"
            data-download-button
          >Download wallpaper 01</a>
          <div class="campaign-footer">
            <span>next wallpaper drops <strong>August 3</strong></span>
            <a href="mailto:say@seori.studio">say@seori.studio</a>
          </div>
        </section>
      </main>
    </div>

    <!-- Optional GoatCounter setup after account creation:
    <script data-goatcounter="https://YOUR_ACCOUNT.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    -->
    <script src="./wallpaper.js" defer></script>
  </body>
</html>
